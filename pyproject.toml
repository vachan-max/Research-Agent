[project]
name = "research-agent"
version = "0.1.0"
description = "Add your description here"

authors = [
    { name = "vachan-max", email = "vachanshetty23@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "firecrawl-py>=4.45.1",
    "fastapi>=0.115.0",
    "langchain-groq>=0.3.0",
    "langgraph>=1.2.12",
    "markdown>=3.7",
    "pydantic>=2.9.0",
    "python-docx>=1.1.2",
    "reportlab>=4.2.2",
    "python-dotenv>=1.2.4",
    "serpapi>=1.1.2",
    "sse-starlette>=2.1.3",
    "uvicorn[standard]>=0.30.6",
]

[project.scripts]
research-agent = "backend.main:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "backend"
module-root = "."
