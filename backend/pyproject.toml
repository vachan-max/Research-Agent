[project]
name = "research-agent"
version = "0.1.0"
description = "A modular Phase 1 deep research agent built with LangGraph and Grok."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "langgraph>=0.2.0",
    "langchain-groq>=0.3.0",
    "pydantic>=2.9.0",
    "serpapi>=0.1.5",
    "firecrawl-py>=1.0.0",
    "python-dotenv>=1.0.1",
    "sse-starlette>=2.1.3",
    "uvicorn[standard]>=0.30.6",
]

[project.scripts]
research-agent = "research_agent.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/research_agent"]

[tool.uv]
package = true
